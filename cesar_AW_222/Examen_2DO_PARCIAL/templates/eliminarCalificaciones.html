<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Calificacion</title>
</head>
<body>
    <div>
        <h1>Eliminar Calificacion</h1>
        <form action="/eliminar/{{Calificacion.0}}"method="POST">
        <input type ="text"name="txtMatricula" value ="{{Calificacion.1}}"readonly>
        <input type ="text"name="txtAlumno" value ="{{Calificacion.2}}"readonly>
        <input type="number" step="0.1" name="txtCalificacion" value="{{Calificacion.3}}" readonly>
        <button type="submit"onclick="return Eliminar()">Eliminar</button>
        <button type="submit"onclick="return Regresar()">Regresar</button>
    </form>
    <script>
        function Eliminar(){
            return confirm("Estas seguro de que quieres eliminarlo");
        }
      function Regresar(){
        window.location.href="{{url_for('index')}}";
      }
    </script>

    </div>
</body>
</html>
