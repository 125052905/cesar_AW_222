<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Calificacion</title>
</head>
<body>
    <div>
        <h1>Calificacion a editar</h1>
        <form action="/actualizar/{{Calificacion.0}}" method="POST">
        <input type="text" name="txtMatricula" value="{{Calificacion.1}}">
        <input type="text" name="txtAlumno" value="{{Calificacion.2}}">
        <input type="number" step="0.1" name="txtCalificacion" value="{{Calificacion.3}}">
        <button type="submit">Actualizar</button>
</form>
    </div>
</body>
</html>
